name: Android APK

# Every push builds the APK (downloadable from the run's artifacts).
# Pushing a tag like v1.2 also publishes it as a GitHub release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Certificate of the release key (the ANDROID_KEYSTORE_BASE64 secret).
      # An APK signed with another key can't be installed over the published
      # one (people would have to uninstall and lose their saved codes), so
      # such a release is refused.
      EXPECTED_CERT_SHA256: e4c5d0182b6663f110f2c90d5cb60df56bb566f9ef095a1d7eef4b45aa0de47a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::Add the ANDROID_KEYSTORE_BASE64 secret to publish a release."
              exit 1
            fi
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Check signing key
        run: |
          OUT=android/app/build/outputs/apk/release
          if [ -z "$ANDROID_KEYSTORE_FILE" ]; then
            cp "$OUT/app-release-unsigned.apk" ussd-manager-unsigned.apk
            exit 0
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs "$OUT/app-release.apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "Signed with certificate $CERT"
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Not the release key; the APK would not install over the published one."
            exit 1
          fi
          cp "$OUT/app-release.apk" ussd-manager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ussd-manager*.apk

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ussd-manager.apk
          generate_release_notes: true
